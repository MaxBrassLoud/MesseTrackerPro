<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FF8200">
  <title>Offline – Messe Tracker Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, 'Segoe UI', Arial, sans-serif;
      background: #000; color: #eee; margin: 0;
      min-height: 100vh; padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #111; border: 1px solid #333; border-radius: 14px;
      padding: 24px; max-width: 460px; width: 100%;
      text-align: center;
    }
    h1 { color: #FF8200; font-size: 1.3em; margin: 0 0 12px; }
    p { color: #aaa; line-height: 1.5; margin: 10px 0; }
    .btn {
      display: block; padding: 14px; margin: 10px 0 0;
      background: #FF8200; color: #000; border: 0;
      border-radius: 10px; font-weight: 700; font-size: 1em;
      text-decoration: none; cursor: pointer; font-family: inherit;
    }
    .btn.alt {
      background: #1a1a1a; color: #eee;
      border: 1px solid #333;
    }
    code {
      background: #1a1a1a; padding: 2px 6px; border-radius: 4px;
      color: #FF8200; font-size: .9em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 Du bist offline</h1>
    <p>
      Die App wurde noch nicht für den Offline-Betrieb vorbereitet.
    </p>
    <p style="color:#ffb84d;font-size:.9em;">
      <b>Wichtig:</b> Bitte öffne die Messe-Tracker-Seite
      <b>einmal mit Internetverbindung</b>, bevor du sie offline
      benutzt. Dann steht die Oberfläche dauerhaft lokal zur
      Verfügung.
    </p>
    <a href="/scan-qr" class="btn">
      📷 QR-Code scannen
    </a>
    <a href="/" class="btn alt">
      🏠 Zur Startseite
    </a>
  </div>
</body>
</html>
